<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#E9EDEC">
<title>OSCE 공부</title>
<style>
  :root{
    color-scheme: light only; -webkit-text-size-adjust:100%;
    --ink:#12212B; --ink-soft:#4A5C66; --paper:#E9EDEC; --card:#FFFFFF;
    --teal:#0F6E6E; --teal-pale:#DCEAE8; --amber:#C46A16; --red:#A8322A; --rule:#C9D2D2;
    --serif: Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#E9EDEC}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans);
       font-size:16px; line-height:1.5; overscroll-behavior-y:none}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  select,textarea{font-family:inherit;font-size:16px;color:inherit}

  .wrap{max-width:640px;margin:0 auto;padding:22px 20px 40px;
        padding-bottom:calc(120px + env(safe-area-inset-bottom))}
  .stage{display:none} .stage.on{display:block}
  h1{font-size:22px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
  p.lede{margin:0 0 20px;color:var(--ink-soft);font-size:14.5px}
  h2{font-size:15px;margin:24px 0 8px;font-weight:600;color:var(--ink-soft)}
  label{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 5px}
  input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--rule);
                       border-radius:3px;background:var(--card);font-family:inherit;font-size:16px}
  select,textarea{width:100%;padding:11px 12px;border:1px solid var(--rule);
                  border-radius:3px;background:var(--card)}
  textarea{min-height:120px;font-size:14px}
  .note{font-size:13px;color:var(--ink-soft);margin-top:10px;line-height:1.5}
  .hide{display:none}
  .err{background:#F6E4E2;border:1px solid var(--red);color:var(--red);
       padding:12px 14px;font-size:14px;margin:14px 0;border-radius:3px}

  .btn{display:block;width:100%;padding:15px;border-radius:3px;background:var(--ink);
       color:#fff;font-weight:600;text-align:center;margin-top:18px}
  .btn.ghost{background:none;color:var(--teal);border:1px solid var(--rule);font-weight:500}
  .btn:disabled{opacity:.4}

  /* 단계 목록 */
  .steps{margin:8px 0 0}
  .step{display:flex;gap:13px;align-items:flex-start;background:var(--card);
        border:1px solid var(--rule);padding:15px 16px;margin-bottom:9px;border-radius:3px}
  .step.done{background:var(--teal-pale);border-color:var(--teal)}
  .step.next{border-color:var(--ink);border-width:2px}
  .step .n{font-family:var(--serif);font-size:20px;line-height:1.1;width:24px;
           flex:none;color:var(--ink-soft)}
  .step.done .n::before{content:"✓";color:var(--teal)}
  .step.done .n{font-size:0}
  .step .t{font-weight:600;font-size:15px}
  .step .d{font-size:13.5px;color:var(--ink-soft);margin-top:3px;line-height:1.45}

  /* 진행 막대 */
  #bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--rule);z-index:50}
  #barFill{height:100%;width:0%;background:var(--teal);transition:width .3s}

  /* 턴 */
  .turn{border-left:2px solid var(--rule);padding:3px 0 3px 13px;margin-bottom:15px}
  .turn.dr{border-left-color:var(--teal)}
  .turn .who{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:3px}
  .turn.dr .who{color:var(--teal)}
  .turn .en{font-size:16px;line-height:1.5}
  .turn .ko{font-size:14px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
  .turn.now{background:var(--card);margin-left:-10px;padding-left:23px;
            border-left-width:3px;border-radius:0 3px 3px 0}
  .turn.dim .en,.turn.dim .ko{opacity:.35}

  /* 카드 한 장 */
  .one{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--ink);
       padding:22px 20px;margin-top:6px;min-height:190px}
  .one .who{font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:12px}
  .one .ko{font-size:17px;line-height:1.55;font-weight:500}
  .one .en{font-family:var(--serif);font-size:18px;line-height:1.55;margin-top:16px;
           padding-top:15px;border-top:1px solid var(--rule)}
  .one .en.veil{filter:blur(7px);user-select:none}
  .counter{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;
           margin:14px 0 0;text-align:center}

  /* 스테이션 카드 */
  .cue{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--ink);
       padding:20px 18px;font-family:var(--serif);font-size:14.5px;line-height:1.5}
  .cue .ci{font-family:var(--sans);font-size:11px;letter-spacing:.09em;
           color:var(--ink-soft);margin-bottom:13px}
  .cue .who2{font-size:16px;font-weight:600;margin:0 0 3px}
  .cue .cc{font-style:italic;margin:0 0 14px}
  .cue .sec{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.05em;
            color:var(--teal);margin:12px 0 4px}
  .cue ul,.cue ol{margin:0;padding-left:18px} .cue li{margin-bottom:4px}
  .cue .tasklab{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.05em;
                margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--rule)}

  /* cue 회상 */
  .slot{background:var(--card);border:1px solid var(--rule);padding:13px 15px;
        margin-bottom:8px;border-radius:3px}
  .slot .body{font-size:15px;line-height:1.45}
  .slot .body.veil{filter:blur(7px)}
  .slot .probe{font-size:13px;color:var(--ink-soft);margin-top:6px}
  .slot .mk{display:flex;gap:8px;margin-top:11px}
  .slot .mk button{flex:1;padding:9px;border:1px solid var(--rule);border-radius:3px;
                   font-size:13.5px;color:var(--ink-soft);background:var(--paper)}
  .slot.got{background:var(--teal-pale);border-color:var(--teal)}
  .slot.miss{opacity:.6}

  /* 하단 조작 */
  .dock{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
        border-top:1px solid var(--rule);padding:11px 20px calc(11px + env(safe-area-inset-bottom));
        z-index:45}
  .dock .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
  .dock button{flex:1;padding:14px;border-radius:3px;background:var(--ink);color:#fff;
               font-weight:600;font-size:15px}
  .dock button.sec{background:var(--card);color:var(--teal);border:1px solid var(--rule);
                   font-weight:500}
  .dock button:disabled{opacity:.4}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="bar"><div id="barFill"></div></div>
<div class="wrap">

<section id="s-home" class="stage on">
  <h1>OSCE 공부</h1>
  <p class="lede">한 케이스를 다섯 단계로 소화합니다. 하루 한 단계, 20분.</p>
  <div id="compat"></div>

  <label for="caseSel">케이스</label>
  <select id="caseSel"></select>

  <label for="rate">읽는 속도</label>
  <select id="rate">
    <option value="0.9">느리게</option>
    <option value="1.05">보통</option>
    <option value="1.2" selected>빠르게</option>
    <option value="1.35">아주 빠르게</option>
  </select>

  <label for="engine">3단계 정답 음성</label>
  <select id="engine">
    <option value="tts">브라우저 기본 — 무료</option>
    <option value="11">ElevenLabs — 크레딧 사용</option>
  </select>

  <div id="elBox" class="hide">
    <label for="elKey">ElevenLabs API 키</label>
    <input type="password" id="elKey" placeholder="계정 → Settings → API Keys" autocomplete="off">
    <button class="btn ghost" id="elLoad">목소리 불러오기</button>
    <div id="elVoiceWrap" class="hide">
      <label for="elVoice">목소리</label>
      <select id="elVoice"></select>
    </div>
    <p class="note">1·2단계는 재생량이 많아 항상 기본 음성을 씁니다. 3단계 확인 버튼에서만 쓰입니다.</p>
  </div>

  <h2>단계</h2>
  <div class="steps" id="steps"></div>

  <button class="btn ghost" id="reset">이 케이스 진도 초기화</button>
  <button class="btn ghost" id="openImport">케이스 불러오기</button>
  <div id="importBox" class="hide">
    <label for="importJson">케이스 팩 JSON</label>
    <textarea id="importJson" placeholder='cases.json 내용을 붙여넣으세요'></textarea>
    <button class="btn ghost" id="doImport">추가</button>
  </div>
</section>

<section id="s-run" class="stage">
  <h1 id="runTitle"></h1>
  <p class="lede" id="runHow"></p>
  <div id="runBody"></div>
</section>

</div>

<div class="dock hide" id="dock"><div class="in" id="dockIn"></div></div>

<script>
"use strict";
const BUILTIN = [];   // 케이스는 코드에 넣지 않는다. 각자 "케이스 불러오기"로 자기 폰에만 저장한다.


const STEPS = [
  { id:0, t:"듣기만 하기",      d:"대화를 끝까지 듣습니다. 따라 하지 말고 흐름만 익히세요.",
    how:"재생을 누르고 듣기만 하세요. 눈으로는 영어와 한국어를 같이 따라갑니다." },
  { id:1, t:"따라 읽기",        d:"Dentist 대사를 소리 내어 따라 읽습니다.",
    how:"한 줄 듣고 똑같이 소리 내어 읽으세요. 다 읽으면 다음을 누릅니다." },
  { id:2, t:"한국어 → 영어",    d:"한국어만 보고 영어로 말합니다.",
    how:"한국어를 보고 영어로 말한 뒤, 확인을 눌러 비교하세요. 완벽할 필요 없습니다." },
  { id:3, t:"Cue 떠올리기",     d:"큐카드만 보고 물어야 할 8가지를 떠올립니다.",
    how:"카드를 읽고, 무엇을 물어야 할지 하나씩 말해보세요. 그다음 열어서 맞춰봅니다." },
  { id:4, t:"롤플레이",         d:"실전처럼 10분 스테이션을 돕니다.",
    how:"" }
];

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const S = { metas:[], kase:null, step:0, i:0, playing:false, veil:true };

const PFX = "osce.";   // 케이스는 롤플레이 앱과 같은 곳에 둔다 (같은 주소라 공유됨)
const store = {
  idx(){
    try{
      const v = JSON.parse(localStorage.getItem(PFX+"index")||"[]");
      return v.map(x => typeof x === "string" ? { id:x, title:x } : x);   // 예전 형식도 읽는다
    }catch(e){ return []; }
  },
  meta(c){
    return { id:c.id, title:c.title||c.id, code:c.code||"",
             module:c.module||99, moduleName:c.moduleName||"", moduleColor:c.moduleColor||"" };
  },
  load(id){                            // 고른 케이스 하나만 펼친다
    try{ const raw = localStorage.getItem(PFX+"c."+id); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  },
  addPacks(list){
    const ids = store.idx();
    let n = 0;
    for(const c of list){
      try{ localStorage.setItem(PFX+"c."+c.id, JSON.stringify(c)); }
      catch(e){
        try{ localStorage.setItem(PFX+"index", JSON.stringify(ids)); }catch(e2){}
        throw new Error("저장 공간이 찼습니다. "+n+"개까지 들어갔습니다. 나머지는 나눠서 넣으세요.");
      }
      const at = ids.findIndex(x => x.id === c.id);
      if(at < 0) ids.push(store.meta(c)); else ids[at] = store.meta(c);
      n++;
    }
    localStorage.setItem(PFX+"index", JSON.stringify(ids));
    return n;
  },
  clearPacks(){
    for(const m of store.idx()){ try{ localStorage.removeItem(PFX+"c."+m.id); }catch(e){} }
    try{ localStorage.removeItem(PFX+"index"); }catch(e){}
  },
  get rate(){ try{ return parseFloat(localStorage.getItem("study.rate"))||1.2; }catch(e){ return 1.2; } },
  set rate(v){ try{ localStorage.setItem("study.rate", v); }catch(e){} },
  get eng(){ try{ return localStorage.getItem("study.engine")||"tts"; }catch(e){ return "tts"; } },
  set eng(v){ try{ localStorage.setItem("study.engine", v); }catch(e){} },
  get elk(){ try{ return localStorage.getItem("osce.elkey")||""; }catch(e){ return ""; } },
  set elk(v){ try{ localStorage.setItem("osce.elkey", v); }catch(e){} },
  get elv(){ try{ return localStorage.getItem("osce.elvoice")||""; }catch(e){ return ""; } },
  set elv(v){ try{ localStorage.setItem("osce.elvoice", v); }catch(e){} },
  get elvn(){ try{ return localStorage.getItem("osce.elvname")||""; }catch(e){ return ""; } },
  set elvn(v){ try{ localStorage.setItem("osce.elvname", v); }catch(e){} },
  prog(id){ try{ return parseInt(localStorage.getItem("study.p."+id)||"0",10); }catch(e){ return 0; } },
  setProg(id,v){ try{ localStorage.setItem("study.p."+id, String(v)); }catch(e){} }
};

/* ── 음성 ── */
const canSpeak = "speechSynthesis" in window;
let voiceCache = null;
function voicesReady(){
  return new Promise(res => {
    if(!canSpeak) return res([]);
    const now = speechSynthesis.getVoices();
    if(now && now.length) return res(now);
    let done=false; const fin=()=>{ if(!done){done=true;res(speechSynthesis.getVoices()||[]);} };
    speechSynthesis.onvoiceschanged = fin; setTimeout(fin, 1500);
  });
}
function pickVoice(vs){
  return vs.find(v=>v.lang&&v.lang.replace("_","-").startsWith("en-AU"))
      || vs.find(v=>v.lang&&v.lang.replace("_","-").startsWith("en-GB"))
      || vs.find(v=>v.lang&&v.lang.startsWith("en")) || null;
}
function speak(text, onEnd){
  if(!canSpeak || !text){ onEnd && onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-AU"; if(voiceCache) u.voice = voiceCache;
  u.rate = store.rate; u.pitch = 1.0;
  u.onend = () => onEnd && onEnd();
  u.onerror = () => onEnd && onEnd();
  speechSynthesis.speak(u);
}
function stopSpeak(){
  if(canSpeak) speechSynthesis.cancel();
  if(elAudio){ try{ elAudio.pause(); }catch(e){} }
}

let elAudio = null, elWarned = false;

async function elevenPlay(text){
  const key = store.elk, vid = store.elv;
  if(!key || !vid) throw new Error("ElevenLabs 설정이 비어 있습니다.");
  const res = await fetch(
    "https://api.elevenlabs.io/v1/text-to-speech/" + encodeURIComponent(vid),
    { method:"POST",
      headers:{ "xi-api-key":key, "content-type":"application/json", "accept":"audio/mpeg" },
      body: JSON.stringify({ text: text, model_id:"eleven_turbo_v2_5",
        voice_settings:{ stability:0.4, similarity_boost:0.75, style:0.35 } }) });
  if(!res.ok){
    if(res.status === 401) throw new Error("ElevenLabs 키가 거부됐습니다.");
    if(res.status === 429) throw new Error("ElevenLabs 크레딧이 부족합니다.");
    throw new Error("ElevenLabs 오류 " + res.status);
  }
  const url = URL.createObjectURL(await res.blob());
  if(elAudio){ try{ elAudio.pause(); }catch(e){} }
  elAudio = new Audio(url);
  elAudio.playbackRate = store.rate;
  elAudio.onended = () => URL.revokeObjectURL(url);
  await elAudio.play();
}

/* 3단계 정답 재생 — 실패하면 기본 음성으로 */
async function sayAnswer(text){
  stopSpeak();
  if(store.eng === "11"){
    try{ await elevenPlay(text); return; }
    catch(e){
      if(!elWarned){ elWarned = true; alert(e.message + "\n기본 음성으로 계속합니다."); }
    }
  }
  speak(text);
}

/* ── 홈 ── */
function groupOptions(cases){
  const groups = [];
  cases.forEach((c,i) => {
    const key = c.moduleName || "분류 없음";
    let g = groups.find(x => x.key === key);
    if(!g){ g = { key:key, no:(c.module||99), color:c.moduleColor||"#8A8F98", items:[] };
            groups.push(g); }
    g.items.push({ i:i, label:(c.code ? c.code+"  " : "") + (c.title||c.id) });
  });
  groups.sort((a,b) => a.no - b.no);
  return groups.map(g =>
    '<optgroup label="'+esc((g.no<90 ? "Module "+g.no+" — " : "")+g.key)+'">' +
    g.items.map(o => '<option value="'+o.i+'">'+esc(o.label)+"</option>").join("") +
    "</optgroup>").join("");
}


/* 예전 저장 형식(한 덩어리)이 남아 있으면 새 형식으로 옮긴다 */
function migrateOldPacks(){
  let old = null;
  try{ old = localStorage.getItem(PFX+"packs"); }catch(e){ return 0; }
  if(!old) return 0;
  let list = [];
  try{ list = JSON.parse(old) || []; }catch(e){ return 0; }
  if(!Array.isArray(list) || !list.length){
    try{ localStorage.removeItem(PFX+"packs"); }catch(e){}
    return 0;
  }
  let n = 0;
  try{ n = store.addPacks(list.filter(c => c && c.id)); }catch(e){ n = -1; }
  if(n >= 0){ try{ localStorage.removeItem(PFX+"packs"); }catch(e){} }
  return n;
}

/* 목차에 모듈 정보가 빠져 있으면 저장된 케이스를 읽어 다시 만든다 */
async function fetchVoices(key){
  const tries = [
    "https://api.elevenlabs.io/v2/voices?page_size=100",
    "https://api.elevenlabs.io/v1/voices"        // 구버전 — v2 가 400 이면 이쪽
  ];
  let last = "";
  for(const url of tries){
    let res;
    try{ res = await fetch(url, { headers:{ "xi-api-key": key } }); }
    catch(e){ last = "네트워크 오류"; continue; }
    if(res.ok){
      const vs = (await res.json()).voices || [];
      if(vs.length) return vs;
      last = "목소리가 하나도 없습니다.";
      continue;
    }
    if(res.status === 401){
      throw new Error("키가 거부됐습니다. 만료됐거나 Voices 읽기 권한이 없습니다.");
    }
    last = "오류 " + res.status;
  }
  throw new Error(last || "불러오지 못했습니다.");
}

function repairIndex(){
  const ids = store.idx();
  if(!ids.length) return 0;
  const needs = ids.some(m => !m.moduleName || !m.code);
  if(!needs) return 0;
  let fixed = 0;
  const rebuilt = ids.map(m => {
    if(m.moduleName && m.code) return m;
    const full = store.load(m.id);
    if(!full) return m;
    fixed++;
    return store.meta(full);
  });
  try{ localStorage.setItem(PFX+"index", JSON.stringify(rebuilt)); }catch(e){}
  return fixed;
}

function loadCases(){
  S.metas = BUILTIN.map(store.meta).concat(store.idx());
  $("caseSel").innerHTML = S.metas.length
    ? groupOptions(S.metas)
    : '<option value="">— 아래에서 케이스를 먼저 넣으세요 —</option>';
}

function takeCase(i){
  const m = S.metas[i];
  if(!m) return null;
  const built = BUILTIN.find(c => c.id === m.id);
  return built || store.load(m.id);
}
function drawSteps(){
  if(!S.kase){
    $("steps").innerHTML =
      '<div class="step"><div class="n">·</div><div><div class="t">케이스가 없습니다</div>' +
      '<div class="d">아래 “케이스 불러오기”로 JSON을 넣으면 단계가 나타납니다.</div></div></div>';
    $("barFill").style.width = "0%";
    return;
  }
  const done = store.prog(S.kase.id);
  $("steps").innerHTML = STEPS.map(s => {
    const cls = s.id < done ? "done" : (s.id === done ? "next" : "");
    return '<div class="step '+cls+'" data-s="'+s.id+'">' +
           '<div class="n">'+(s.id+1)+'</div><div><div class="t">'+esc(s.t)+"</div>" +
           '<div class="d">'+esc(s.d)+"</div></div></div>";
  }).join("");
  document.querySelectorAll(".step").forEach(e =>
    e.onclick = () => start(parseInt(e.dataset.s,10)));
  $("barFill").style.width = (done/STEPS.length*100)+"%";
}
function pickCase(){
  const v = $("caseSel").value;
  S.kase = v === "" ? null : takeCase(+v);
  drawSteps();
}

/* ── 단계 실행 ── */
function dock(buttons){
  $("dock").classList.remove("hide");
  $("dockIn").innerHTML = buttons.map((b,i) =>
    '<button class="'+(b.sec?"sec":"")+'" data-b="'+i+'"'+(b.off?" disabled":"")+">"+esc(b.label)+"</button>").join("");
  document.querySelectorAll("#dockIn button").forEach(e =>
    e.onclick = () => buttons[parseInt(e.dataset.b,10)].go());
}
function home(){
  stopSpeak(); S.playing = false;
  $("dock").classList.add("hide");
  document.querySelectorAll(".stage").forEach(e=>e.classList.remove("on"));
  $("s-home").classList.add("on"); drawSteps(); window.scrollTo(0,0);
}
function finishStep(){
  if(store.prog(S.kase.id) < S.step+1) store.setProg(S.kase.id, S.step+1);
  home();
}
function open_(step){
  S.step = step; S.i = 0; S.veil = true;
  const meta = STEPS[step];
  $("runTitle").textContent = (step+1)+". "+meta.t;
  $("runHow").textContent = meta.how;
  document.querySelectorAll(".stage").forEach(e=>e.classList.remove("on"));
  $("s-run").classList.add("on"); window.scrollTo(0,0);
}
function turns(){ return (S.kase.study && S.kase.study.turns) || []; }
function drTurns(){ return turns().filter(t => t.who === "dr"); }

function start(step){
  if(!S.kase){ alert("케이스를 먼저 넣으세요."); return; }
  if(step === 4){ location.href = "index.html"; return; }
  if(step <= 2 && !turns().length){
    alert("이 케이스에는 스크립트가 없습니다. 변환을 다시 해보세요."); return;
  }
  open_(step);
  if(step === 0) runListen();
  else if(step === 1) runShadow();
  else if(step === 2) runRecall();
  else if(step === 3) runCues();
}

/* 0 — 듣기만 */
function runListen(){
  const ts = turns();
  $("runBody").innerHTML = ts.map((t,i) =>
    '<div class="turn '+(t.who==="dr"?"dr":"pt")+'" id="t'+i+'">' +
    '<div class="who">'+(t.who==="dr"?"Dentist":"Patient")+"</div>" +
    '<div class="en">'+esc(t.en)+'</div><div class="ko">'+esc(t.ko)+"</div></div>").join("");

  const mark = i => {
    document.querySelectorAll(".turn").forEach(e=>e.classList.remove("now"));
    const e = $("t"+i);
    if(e){ e.classList.add("now"); e.scrollIntoView({block:"center",behavior:"smooth"}); }
  };
  const step = () => {
    if(!S.playing || S.i >= ts.length){
      S.playing = false;
      dock([{label:"처음으로",sec:true,go:home},{label:"들었습니다 — 다음 단계",go:finishStep}]);
      return;
    }
    mark(S.i);
    speak(ts[S.i].en, () => { S.i++; setTimeout(step, 260); });
  };
  dock([
    {label:"처음으로",sec:true,go:home},
    {label:"재생",go:()=>{ if(S.playing){ S.playing=false; stopSpeak(); dockListen(false); }
                          else { S.playing=true; dockListen(true); step(); } }}
  ]);
  function dockListen(on){
    dock([{label:"처음으로",sec:true,go:home},
          {label:on?"정지":"재생",go:()=>{ if(S.playing){S.playing=false;stopSpeak();dockListen(false);}
                                          else {S.playing=true;dockListen(true);step();} }},
          {label:"다 들었음",sec:true,go:finishStep}]);
  }
}

/* 1 — 따라 읽기 */
function runShadow(){
  const ts = turns();
  const draw = () => {
    $("runBody").innerHTML = ts.map((t,i) =>
      '<div class="turn '+(t.who==="dr"?"dr":"pt")+(i===S.i?" now":" dim")+'" id="t'+i+'">' +
      '<div class="who">'+(t.who==="dr"?"Dentist":"Patient")+"</div>" +
      '<div class="en">'+esc(t.en)+'</div><div class="ko">'+esc(t.ko)+"</div></div>").join("");
    const e = $("t"+S.i); if(e) e.scrollIntoView({block:"center"});
    $("dockIn") && dock([
      {label:"◀",sec:true,off:S.i===0,go:()=>{ if(S.i>0){S.i--;draw();} }},
      {label:"다시 듣기",sec:true,go:()=>speak(ts[S.i].en)},
      S.i >= ts.length-1
        ? {label:"완료",go:finishStep}
        : {label:"다음 ▶",go:()=>{ S.i++; draw(); speak(ts[S.i].en); }}
    ]);
  };
  draw(); speak(ts[0].en);
}

/* 2 — 한국어 → 영어 */
function runRecall(){
  const ds = drTurns();
  const draw = () => {
    const t = ds[S.i];
    $("runBody").innerHTML =
      '<div class="one"><div class="who">DENTIST — 이 뜻을 영어로 말해보세요</div>' +
      '<div class="ko">'+esc(t.ko)+"</div>" +
      '<div class="en'+(S.veil?" veil":"")+'">'+esc(t.en)+"</div></div>" +
      '<p class="counter">'+(S.i+1)+" / "+ds.length+"</p>";
    dock(S.veil
      ? [{label:"처음으로",sec:true,go:home},{label:"확인",go:()=>{ S.veil=false; draw(); sayAnswer(t.en); }}]
      : [{label:"다시 듣기",sec:true,go:()=>sayAnswer(t.en)},
         S.i >= ds.length-1
           ? {label:"완료",go:finishStep}
           : {label:"다음 ▶",go:()=>{ S.i++; S.veil=true; draw(); }}]);
  };
  draw();
}

/* 3 — Cue 떠올리기 */
function runCues(){
  const k = S.kase, card = k.card, cues = k.cues || [];
  let h = '<div class="cue"><div class="ci">CANDIDATE INSTRUCTIONS</div>';
  if(card){
    h += '<p class="who2">'+esc(card.patient)+"</p>";
    if(card.complaint) h += '<p class="cc">\u201C'+esc(card.complaint)+"\u201D</p>";
    (card.sections||[]).forEach(s => {
      if(!s.items || !s.items.length) return;
      h += '<div class="sec">'+esc(s.heading.toUpperCase())+"</div><ul>" +
           s.items.map(i=>"<li>"+esc(i)+"</li>").join("")+"</ul>";
    });
    h += '<div class="tasklab">TASK</div><ol>' +
         (card.tasks||[]).map(t=>"<li>"+esc(t)+"</li>").join("")+"</ol>";
  } else {
    h += "<p>"+esc((k.cueCard&&k.cueCard.setting)||"")+"</p>";
  }
  h += "</div><h2>물어야 할 것 "+cues.length+"가지</h2>";
  h += cues.map((c,i) =>
    '<div class="slot" id="c'+i+'"><div class="body veil">'+esc(c.hidden||"")+"</div>" +
    (c.probe ? '<div class="probe hide">유도 질문: '+esc(c.probe)+"</div>" : "") +
    '<div class="mk"><button data-o="'+i+'">열기</button></div></div>').join("");
  $("runBody").innerHTML = h;

  const wire = () => document.querySelectorAll("#runBody .mk button").forEach(b => {
    b.onclick = () => {
      const i = b.dataset.o != null ? +b.dataset.o : +b.dataset.m;
      const slot = $("c"+i);
      if(b.dataset.o != null){
        slot.querySelector(".body").classList.remove("veil");
        const p = slot.querySelector(".probe"); if(p) p.classList.remove("hide");
        slot.querySelector(".mk").innerHTML =
          '<button data-m="'+i+'" data-v="1">떠올렸음</button>' +
          '<button data-m="'+i+'" data-v="0">못 떠올림</button>';
        wire();
      } else {
        slot.classList.add(b.dataset.v === "1" ? "got" : "miss");
        slot.querySelector(".mk").remove();
      }
    };
  });
  wire();
  dock([{label:"처음으로",sec:true,go:home},{label:"완료",go:finishStep}]);
}

/* ── 초기화 ── */
(function(){
  if(!canSpeak) $("compat").innerHTML =
    '<div class="err">이 브라우저는 음성 재생을 지원하지 않습니다. 글로만 진행됩니다.</div>';
  voicesReady().then(vs => { voiceCache = pickVoice(vs); });
  $("rate").value = String(store.rate);
  $("rate").onchange = () => store.rate = parseFloat($("rate").value)||1.2;
  $("openImport").onclick = () => $("importBox").classList.toggle("hide");
  $("caseSel").onchange = pickCase;
  try{ migrateOldPacks(); }catch(e){}
  try{ repairIndex(); }catch(e){}
  try{ loadCases(); pickCase(); }
  catch(e){ alert("케이스 목록을 읽지 못했습니다: " + e.message); }

  /* ElevenLabs 설정 */
  const toggleEl = () => $("elBox").classList.toggle("hide", $("engine").value !== "11");
  $("engine").value = store.eng;
  $("elKey").value = store.elk;
  toggleEl();
  if(store.eng === "11" && store.elv){
    $("elVoice").innerHTML = '<option value="'+esc(store.elv)+'">'+esc(store.elvn||"저장된 목소리")+"</option>";
    $("elVoiceWrap").classList.remove("hide");
  }
  $("engine").onchange = () => { store.eng = $("engine").value; elWarned = false; toggleEl(); };
  $("elVoice").onchange = () => {
    store.elv = $("elVoice").value;
    store.elvn = $("elVoice").options[$("elVoice").selectedIndex].text;
  };
  $("elLoad").onclick = async () => {
    const key = $("elKey").value.trim();
    if(!key){ alert("ElevenLabs 키를 넣으세요."); return; }
    store.elk = key; elWarned = false;
    const btn = $("elLoad"); btn.disabled = true; btn.textContent = "불러오는 중…";
    try{
      const vs = await fetchVoices(key);
      if(!vs.length) throw new Error("목소리가 없습니다.");
      vs.sort((a,b) => {
        const au = v => /austral/i.test((v.labels&&v.labels.accent)||"") ? 0 : 1;
        return au(a)-au(b) || (a.name||"").localeCompare(b.name||"");
      });
      $("elVoice").innerHTML = vs.map(v => {
        const l = v.labels||{};
        const tag = [l.accent,l.gender,l.age].filter(Boolean).join(" · ");
        return '<option value="'+esc(v.voice_id)+'">'+esc(v.name)+(tag?" — "+esc(tag):"")+"</option>";
      }).join("");
      if(store.elv) $("elVoice").value = store.elv;
      store.elv = $("elVoice").value;
      store.elvn = $("elVoice").options[$("elVoice").selectedIndex].text;
      $("elVoiceWrap").classList.remove("hide");
      btn.textContent = vs.length+"개 불러옴 — 다시 불러오기";
    }catch(e){
      alert("목소리를 불러오지 못했습니다: "+e.message);
      btn.textContent = "목소리 불러오기";
    }finally{ btn.disabled = false; }
  };

  $("reset").onclick = () => { if(!S.kase) return; store.setProg(S.kase.id, 0); drawSteps(); };
  $("openImport").onclick = () => $("importBox").classList.toggle("hide");
  $("doImport").onclick = () => {
    let add;
    try{
      const v = JSON.parse($("importJson").value);
      add = Array.isArray(v) ? v : [v];
      add.forEach(c => { if(!c.id) throw new Error("id 가 없는 항목이 있습니다."); });
    }catch(e){ alert("JSON을 읽지 못했습니다: " + e.message); return; }
    let n = 0;
    try{ n = store.addPacks(add); }
    catch(e){ loadCases(); pickCase(); alert(e.message); return; }
    loadCases(); pickCase();
    $("importJson").value = ""; $("importBox").classList.add("hide");
    alert(n + "개 케이스를 넣었습니다.");
  };
})();
</script>
</body>
